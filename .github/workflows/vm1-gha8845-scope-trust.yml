name: VM1 GHA v25 Scope Trust

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

jobs:
  detect-scopes:
    if: github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch fork head object without checking out PR code
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.clone_url }}
        run: git fetch --no-tags --depth=1 "$HEAD_REPO" "$HEAD_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Get git refs
        id: refs
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes-git-refs

      - name: Get scopes
        id: scopes
        env:
          HEAD: ${{ steps.refs.outputs.head }}
          BASE: ${{ steps.refs.outputs.base }}
        run: |
          [ -n "$BASE" ] || { echo "no base ref reported" >&2; exit 1; }
          projects=$(npx nx show projects --affected --base="$BASE" --head="$HEAD") || exit 1
          scopes=$(printf '%s\n' "$projects" | paste -sd, -)
          echo "VM1_BASE=$BASE"
          echo "VM1_HEAD=$HEAD"
          echo "VM1_SCOPES=$scopes"
          echo "scopes=$scopes" >> "$GITHUB_OUTPUT"

      - name: Scopes upload
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes-upload
          token: ${{ secrets.MERGIFY_TOKEN_VM1_GHA8845 }}
          scopes: ${{ steps.scopes.outputs.scopes }}
