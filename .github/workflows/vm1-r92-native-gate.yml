name: VM1 Root92 Native Gate
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions: {}
jobs:
  gate:
    if: github.event.pull_request.base.ref == 'vm1-r92-native-base-260927'
    name: vm1-r92-native-gate
    runs-on: ubuntu-latest
    steps:
      - name: Title-controlled gate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" == *"GREEN"* ]]; then
            echo "green"
            exit 0
          fi
          echo "red"
          exit 1
